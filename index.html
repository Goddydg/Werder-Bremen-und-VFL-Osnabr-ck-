
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b13">
<title>Werder Bremen & VfL Osnabrück</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b13;color:#f5f7f5;font-family:Arial,sans-serif}
header{padding:20px 16px;background:#103b28}
header h1{margin:0;font-size:25px}
header p{margin-bottom:0;color:#c5d5cb}
main{padding:12px}
.league{margin-bottom:30px;padding:14px;border-radius:16px;background:#10291e;border:1px solid #244a37}
.league-green{border-top:5px solid #35a66b}
.league-purple{background:#20142d;border-color:#593477;border-top:5px solid #a855f7}
h2{font-size:22px;margin:4px 0 14px}
h3{font-size:18px;margin:20px 0 10px}
h4{font-size:15px;margin:12px 0}
.club{display:inline-block;padding:7px 11px;margin-bottom:12px;border-radius:8px;background:#1d7045;color:white;font-weight:bold}
.league-purple .club{background:#6b21a8}
.selector{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
select{max-width:100%;padding:11px;border-radius:9px;background:#173c2a;color:white;border:1px solid #477258;font-size:15px}
.league-purple select{background:#35194b;border-color:#8b5bb4}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:490px;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;border-bottom:1px solid #294536;text-align:center;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left}
th{color:#b9d3c3;font-size:12px}
.league-purple th{color:#dfc9f1}
.league-purple th,.league-purple td{border-bottom-color:#493257}
tr.werder-row{background:#1d7045!important;color:white;font-weight:bold}
tr.vfl-row{background:#6b21a8!important;color:white;font-weight:bold}
.match{padding:12px;margin:8px 0;border-bottom:1px solid #294536;border-radius:9px}
.league-purple .match{border-bottom-color:#493257}
.match-date{color:#a9beb0;font-size:12px;margin-bottom:8px}
.league-purple .match-date{color:#c8b3d9}
.score{display:inline-block;padding:0 5px;font-weight:bold;white-space:nowrap}

.refresh{display:block;width:100%;margin:12px 0;padding:12px;border:1px solid #37684f;border-radius:10px;background:#194a34;color:white;font-size:14px}
.league-purple .refresh{background:#4c1d72;border-color:#8b5bb4}
.match.werder-match{background:#1d7045;border:1px solid #35a66b;color:#fff}
.match.vfl-match{background:#6b21a8;border:1px solid #a855f7;color:#fff}
.match.werder-match .match-date,.match.vfl-match .match-date{color:#fff}
.team-highlight{display:inline-block;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.18);font-weight:bold}
.live-badge{display:inline-block;background:#e32636;color:#fff;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:bold;margin-right:5px}
.finished-badge{display:inline-block;background:#40584a;color:#fff;border-radius:5px;padding:3px 7px;font-size:11px;margin-right:5px}
.update-info{font-size:12px;color:#a9beb0;margin-top:8px}
.match-button{
  display:block;width:100%;min-height:64px;padding:12px 8px;
  border:0;border-radius:9px;background:rgba(255,255,255,.07);

}
.match-button:focus-visible{outline:2px solid white;outline-offset:4px}
.tap-hint{font-size:14px;font-weight:bold;line-height:1.4;margin-top:12px;padding:7px 0 2px}
.match-details{display:block;margin-top:12px;padding:12px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18)}
.detail-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px}
.detail-line span:last-child{text-align:right;overflow-wrap:anywhere}
.detail-label{opacity:.8}
.scorer{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px}
.no-data{font-size:13px;line-height:1.5;opacity:.85}
.lineup-button{
  display:block;width:100%;margin-top:8px;padding:8px 9px;
  border:1px solid rgba(255,255,255,.4);border-radius:8px;
  background:rgba(0,0,0,.22);color:white;font-size:12px;
  font-weight:bold;line-height:1.3;text-align:center;cursor:pointer;
  touch-action:manipulation
}
.lineup-button:active{opacity:.75}
.lineup-button:focus-visible{outline:2px solid white;outline-offset:3px}
.section-note{font-size:12px;opacity:.8;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>⚽ Werder & VfL</h1>
  <p>Bundesliga · Spieltage · Tabellen</p>
</header>

<main>
  <section class="league league-green">
    <h2>🟢 1. Bundesliga</h2>
    <div class="club">🟢 SV Werder Bremen</div>
    <h3>Spiele des Spieltags</h3>
    <div id="bl1-selector"></div>
    <div id="bl1-games">Daten werden geladen …</div>
    <h3>Tabelle</h3>
    <div id="bl1-table">Tabelle wird geladen …</div>
    <div class="update-info" id="bl1-update"></div>
    <button class="refresh" type="button" onclick="refreshData(true)">Daten jetzt aktualisieren</button>
  </section>

  <section class="league league-purple">
    <h2>🟣 2. Bundesliga</h2>
    <div class="club">🟣 VfL Osnabrück</div>
    <h3>Spiele des Spieltags</h3>
    <div id="bl2-selector"></div>
    <div id="bl2-games">Daten werden geladen …</div>
    <h3>Tabelle</h3>
    <div id="bl2-table">Tabelle wird geladen …</div>
    <div class="update-info" id="bl2-update"></div>
    <button class="refresh" type="button" onclick="refreshData(true)">Daten jetzt aktualisieren</button>
  </section>
</main>

<script>
'use strict';

const base='./data/';
const season=2026;

let standings={bl1:null,bl2:null};
let matches={bl1:[],bl2:[]};
let footballMatches={bl1:[],bl2:[]};
let scorers={bl1:[],bl2:[]};
let selectedRound={bl1:null,bl2:null};
let expandedMatch={bl1:null,bl2:null};
let lastUpdate=null;
let loading=false;
let initialRenderDone=false;

function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function loadJSON(url){
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  return response.json();
}

async function loadFile(file){
  return loadJSON(base+file+'?t='+Date.now());
}

async function loadLiveGames(key){
  const data=await loadJSON(
    `https://api.openligadb.de/getmatchdata/${key}/${season}`
  );
  if(!Array.isArray(data))throw new Error('Ungültige Spieldaten');
  return data;
}

function getGames(key){return matches[key]||[]}

function roundNumber(match){
  return Number(match.group?.groupOrderID??match.groupOrderID??match.matchday??0);
}

function gameDate(match){return match.matchDateTime||null}
function isFinished(match){return Boolean(match.matchIsFinished)}

function matchKey(match){
  if(match.matchID!=null)return String(match.matchID);
  return [
    match.team1?.teamName||'',
    match.team2?.teamName||'',
    gameDate(match)||''
  ].join('|');
}

function normalizeName(value){
  return String(value||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
}

function footballTeamName(team){
  return team?.name||team?.shortName||team?.tla||'';
}

/* Verknüpft beide Datenquellen über Mannschaften und Anstoßzeit. */
function findFootballMatch(match,key){
  const list=footballMatches[key]||[];
  const home=normalizeName(match.team1?.teamName);
  const away=normalizeName(match.team2?.teamName);
  const kickoff=gameDate(match)?new Date(gameDate(match)).getTime():null;

  let best=null;
  let bestDiff=Infinity;

  for(const candidate of list){
    const cHome=normalizeName(footballTeamName(candidate.homeTeam));
    const cAway=normalizeName(footballTeamName(candidate.awayTeam));

    if(!home||!away||home!==cHome||away!==cAway)continue;

    const cDate=candidate.utcDate?new Date(candidate.utcDate).getTime():null;
    const diff=kickoff!==null&&cDate!==null?Math.abs(kickoff-cDate):0;

    if(diff<bestDiff){
      best=candidate;
      bestDiff=diff;
    }
  }

  // Keine Verbindung bei zu stark abweichenden Anstoßzeiten.
  if(best&&kickoff!==null&&best.utcDate&&bestDiff>36*60*60*1000)
    return null;

  return best;
}

function findDefaultRound(games){
  const rounds=[...new Set(games.map(roundNumber).filter(n=>n>0))]
    .sort((a,b)=>a-b);
  if(!rounds.length)return null;

  const now=Date.now();
  const today=new Date().toDateString();

  const todayRounds=games.filter(g=>gameDate(g)&&
    new Date(gameDate(g)).toDateString()===today)
    .map(roundNumber).filter(n=>n>0);
  if(todayRounds.length)return todayRounds[0];

  const upcoming=games.filter(g=>!isFinished(g)&&gameDate(g)&&
    new Date(gameDate(g)).getTime()>=now)
    .sort((a,b)=>new Date(gameDate(a))-new Date(gameDate(b)));
  if(upcoming.length)return roundNumber(upcoming[0]);

  const unfinished=games.filter(g=>!isFinished(g)&&roundNumber(g)>0)
    .sort((a,b)=>new Date(gameDate(a)||0)-new Date(gameDate(b)||0));
  if(unfinished.length)return roundNumber(unfinished[0]);

  return Math.max(...rounds);
}

function ensureRound(key){
  if(selectedRound[key]===null)
    selectedRound[key]=findDefaultRound(getGames(key));
}

function changeRound(key,value){
  selectedRound[key]=Number(value);
  expandedMatch[key]=null;
  renderGames(key);
}

function roundSelector(key){
  const rounds=[...new Set(getGames(key).map(roundNumber).filter(n=>n>0))]
    .sort((a,b)=>a-b);
  ensureRound(key);

  if(!rounds.length)return '<p class="muted">Keine Spieltage verfügbar.</p>';

  return `<div class="selector">
    <label for="${key}-round"><b>Spieltag:</b></label>
    <select id="${key}-round" onchange="changeRound('${key}',this.value)">
      ${rounds.map(n=>`<option value="${n}" ${n===selectedRound[key]?'selected':''}>${n}. Spieltag</option>`).join('')}
    </select>
  </div>`;
}

function selectedGames(key){
  ensureRound(key);
  return getGames(key)
    .filter(g=>roundNumber(g)===selectedRound[key])
    .sort((a,b)=>new Date(gameDate(a)||0)-new Date(gameDate(b)||0));
}

function teamNames(match){
  return {
    home:match.team1?.teamName||'Unbekannt',
    away:match.team2?.teamName||'Unbekannt'
  };
}

function footballScore(match){
  const score=match?.score;
  if(!score)return null;

  const full=score.fullTime;
  const half=score.halfTime;
  const regular=score.regularTime;
  const chosen=full?.home!=null&&full?.away!=null?full:
    regular?.home!=null&&regular?.away!=null?regular:null;

  return chosen?`${chosen.home} : ${chosen.away}`:null;
}

function gameScore(match,key){
  const apiMatch=findFootballMatch(match,key);
  const apiResult=footballScore(apiMatch);
  if(apiResult)return apiResult;

  const results=match.matchResults||[];
  if(!results.length)return '– : –';

  const result=results.reduce((best,r)=>
    !best||Number(r.resultTypeID||0)>Number(best.resultTypeID||0)?r:best,null);

  if(!result||result.pointsTeam1==null||result.pointsTeam2==null)
    return '– : –';

  return `${result.pointsTeam1} : ${result.pointsTeam2}`;
}

function isLive(match,key){
  const apiMatch=findFootballMatch(match,key);
  if(apiMatch){
    if(['IN_PLAY','LIVE','PAUSED'].includes(apiMatch.status))return true;
    if(apiMatch.status==='FINISHED')return false;
  }

  if(isFinished(match))return false;
  const kickoff=gameDate(match);
  if(!kickoff)return false;
  const elapsed=Date.now()-new Date(kickoff).getTime();
  return elapsed>=0&&elapsed<=3*60*60*1000;
}

function formatDate(value){
  if(!value)return 'Termin offen';
  return new Date(value).toLocaleString('de-DE',{
    weekday:'short',day:'2-digit',month:'2-digit',
    hour:'2-digit',minute:'2-digit'
  });
}

function statusHTML(match,key){
  const apiMatch=findFootballMatch(match,key);
  const status=apiMatch?.status;

  if(isFinished(match)||status==='FINISHED')
    return '<span class="finished-badge">BEENDET</span> '+esc(formatDate(gameDate(match)));

  if(isLive(match,key))
    return '<span class="live-badge">● LIVE</span> '+esc(formatDate(gameDate(match)));

  if(status==='POSTPONED')return '⏸ Verschoben · '+esc(formatDate(gameDate(match)));
  if(status==='CANCELLED')return 'Abgesagt · '+esc(formatDate(gameDate(match)));

  return esc(formatDate(gameDate(match)));
}

function isWerder(name){
  const n=name.toLowerCase();
  return n.includes('werder')||n.includes('bremen');
}

function isVfL(name){
  const n=name.toLowerCase();
  return n.includes('osnabrück')||n.includes('osnabrueck')||n.includes('vfl osnabr');
}

function teamSlug(name){
  return String(name||'')
    .toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe')
    .replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

/* Der bisherige Bundesliga-Link bleibt unverändert. */
function aufstellungAbrufen(key,index){
  const match=selectedGames(key)[index];
  if(!match)return;

  const names=teamNames(match);
  const round=roundNumber(match);
  const leaguePath=key==='bl1'?'bundesliga':'2bundesliga';
  const seasonPath=`${season}-${season+1}`;
  const matchup=`${teamSlug(names.home)}-vs-${teamSlug(names.away)}`;

  const url=`https://www.bundesliga.com/de/${leaguePath}/spieltag/`+
    `${seasonPath}/${round}/${matchup}/liveticker`;

  window.open(url,'_blank','noopener,noreferrer');
}

function detailLine(label,value){
  if(value===undefined||value===null||value==='')return '';
  return `<div class="detail-line"><span class="detail-label">${esc(label)}</span><span>${esc(value)}</span></div>`;
}

function playerName(player){
  if(!player)return '';
  if(typeof player==='string')return player;
  return player.name||[player.firstName,player.lastName].filter(Boolean).join(' ')||
    player.lastName||'';
}

function minuteText(event){
  const minute=event.minute??event.matchMinute??event.minuteOfPlay;
  if(minute==null)return '';
  const extra=event.injuryTime?`+${event.injuryTime}`:'';
  return `${minute}${extra}′`;
}

function renderGoals(match,apiMatch){
  const goals=Array.isArray(match.goals)?match.goals:[];
  const apiGoals=Array.isArray(apiMatch?.goals)?apiMatch.goals:[];
  const entries=[];

  goals.forEach(g=>entries.push({
    minute:g.matchMinute,
    player:g.goalGetterName||'Torschütze nicht angegeben',
    team:g.teamName||'',
    penalty:Boolean(g.isPenalty),
    ownGoal:Boolean(g.isOwnGoal),
    source:'OpenLigaDB'
  }));

  apiGoals.forEach(g=>{
    const player=playerName(g.scorer)||playerName(g.player);
    const minute=g.minute;
    const team=g.team?.name||'';
    const duplicate=entries.some(e=>
      normalizeName(e.player)===normalizeName(player)&&
      String(e.minute??'')===String(minute??'')
    );
    if(!duplicate)entries.push({
      minute,
      player:player||'Torschütze nicht angegeben',
      team,
      penalty:g.type==='PENALTY',
      ownGoal:g.type==='OWN',
      source:'football-data.org'
    });
  });

  entries.sort((a,b)=>(Number(a.minute)||0)-(Number(b.minute)||0));

  if(!entries.length)
    return '<p class="no-data">Für dieses Spiel sind keine Torschützen hinterlegt.</p>';

  return entries.map(g=>{
    const extras=[
      g.penalty?'Elfmeter':'',
      g.ownGoal?'Eigentor':''
    ].filter(Boolean).join(' · ');

    return `<div class="scorer">
      <b>${esc(g.minute==null?'':g.minute+'′')}</b> ${esc(g.player)}
      ${extras?`<span class="detail-label"> (${esc(extras)})</span>`:''}
      ${g.team?`<div class="detail-label">${esc(g.team)}</div>`:''}
    </div>`;
  }).join('');
}

function renderBookings(apiMatch){
  const bookings=Array.isArray(apiMatch?.bookings)?apiMatch.bookings:[];
  if(!bookings.length)
    return '<p class="no-data">Keine Kartendaten in den gespeicherten Spieldaten vorhanden. Das kann am API-Tarif liegen.</p>';

  return bookings.map(b=>{
    const type=String(b.card||b.type||'').toUpperCase();
    let label='🟨 Karte';
    if(type.includes('YELLOW_RED')||type.includes('YELLOW-RED')||type.includes('SECOND_YELLOW'))
      label='🟨🟥 Gelb-Rote Karte';
    else if(type.includes('RED'))label='🟥 Rote Karte';
    else if(type.includes('YELLOW'))label='🟨 Gelbe Karte';

    return `<div class="scorer">
      <b>${esc(minuteText(b))}</b> ${esc(label)} – ${esc(playerName(b.player)||'Spieler unbekannt')}
      ${b.team?.name?`<div class="detail-label">${esc(b.team.name)}</div>`:''}
    </div>`;
  }).join('');
}

function renderSubs(apiMatch){
  const subs=Array.isArray(apiMatch?.substitutions)?apiMatch.substitutions:[];
  if(!subs.length)
    return '<p class="no-data">Keine Auswechslungen in den gespeicherten Spieldaten vorhanden.</p>';

  return subs.map(s=>{
    const playerOut=playerName(s.playerOut)||playerName(s.playerOutName)||'';
    const playerIn=playerName(s.playerIn)||playerName(s.playerInName)||'';
    return `<div class="scorer">
      <b>${esc(minuteText(s))}</b>
      ${esc(playerOut||'Auswechslung')} ${playerOut&&playerIn?'→ ':''}${esc(playerIn)}
      ${s.team?.name?`<div class="detail-label">${esc(s.team.name)}</div>`:''}
    </div>`;
  }).join('');
}

function renderLineup(apiMatch,side){
  const team=apiMatch?.[side];
  const lineup=Array.isArray(team?.lineup)?team.lineup:[];
  const bench=Array.isArray(team?.bench)?team.bench:[];

  if(!lineup.length&&!bench.length)return '';

  let html=`<h4>${esc(team?.name||'Mannschaft')}</h4>`;

  if(lineup.length){
    html+='<div class="scorer"><b>Startaufstellung</b></div>';
    html+=lineup.map(p=>{
      const number=p.shirtNumber!=null?`${p.shirtNumber} · `:'';
      return `<div class="scorer">${esc(number+playerName(p))}</div>`;
    }).join('');
  }

  if(bench.length){
    html+='<div class="scorer"><b>Ersatzbank</b></div>';
    html+=bench.map(p=>{
      const number=p.shirtNumber!=null?`${p.shirtNumber} · `:'';
      return `<div class="scorer">${esc(number+playerName(p))}</div>`;
    }).join('');
  }

  return html;
}

function detailsHTML(match,key){
  const names=teamNames(match);
  const apiMatch=findFootballMatch(match,key);
  const results=[...(match.matchResults||[])].sort(
    (a,b)=>Number(a.resultTypeID||0)-Number(b.resultTypeID||0)
  );

  let html='<div class="match-details"><h4>📋 Spieldetails</h4>';
  html+=detailLine('Begegnung',`${names.home} – ${names.away}`);
  html+=detailLine('Spielbeginn',formatDate(gameDate(match)));

  const venue=apiMatch?.venue||
    match.matchLocation?.locationStadium||
    match.location?.locationStadium||'';
  const city=match.matchLocation?.locationCity||
    match.location?.locationCity||'';

  html+=detailLine('Stadion',venue);
  html+=detailLine('Spielort',city);
  html+=detailLine('Schiedsrichter',apiMatch?.referees?.map(r=>r.name).filter(Boolean).join(', '));
  html+=detailLine('Zuschauer',apiMatch?.attendance);

  if(apiMatch?.status)html+=detailLine('API-Spielstatus',apiMatch.status);
  if(apiMatch?.minute!=null)html+=detailLine('Spielminute',`${apiMatch.minute}′`);

  const ft=apiMatch?.score?.fullTime;
  const ht=apiMatch?.score?.halfTime;
  const regular=apiMatch?.score?.regularTime;

  if(ht?.home!=null&&ht?.away!=null)
    html+=detailLine('Halbzeit (football-data.org)',`${ht.home} : ${ht.away}`);
  if(regular?.home!=null&&regular?.away!=null)
    html+=detailLine('Reguläre Spielzeit',`${regular.home} : ${regular.away}`);
  if(ft?.home!=null&&ft?.away!=null)
    html+=detailLine('Endstand (football-data.org)',`${ft.home} : ${ft.away}`);

  if(results.length){
    html+='<h4>Ergebnisse OpenLigaDB</h4>';
    results.forEach(result=>{
      const label=result.resultName||
        (Number(result.resultTypeID)===1?'Halbzeit':
         Number(result.resultTypeID)===2?'Endstand':'Spielstand');
      html+=detailLine(label,`${result.pointsTeam1} : ${result.pointsTeam2}`);
    });
  }

  html+='<h4>⚽ Torschützen</h4>'+renderGoals(match,apiMatch);
  html+='<h4>🟨 Karten</h4>'+renderBookings(apiMatch);
  html+='<h4>🔄 Auswechslungen</h4>'+renderSubs(apiMatch);

  const lineups=renderLineup(apiMatch,'homeTeam')+
    renderLineup(apiMatch,'awayTeam');

  if(lineups){
    html+='<h4>👥 Aufstellungen</h4>'+lineups;
  }else{
    html+='<h4>👥 Aufstellungen</h4><p class="no-data">Keine Aufstellungen in den gespeicherten Daten vorhanden.</p>';
  }

  html+='<p class="no-data">Angezeigt werden die Daten, die in den gespeicherten API-Antworten vorhanden sind. Fehlende Werte werden nicht geschätzt. Erweiterte Daten können eine entsprechende API-Berechtigung voraussetzen.</p>';
  html+='</div>';
  return html;
}

function toggleDetails(key,index){
  const match=selectedGames(key)[index];
  if(!match)return;

  const id=matchKey(match);
  const slot=document.getElementById('details-'+key+'-'+index);
  const hint=document.getElementById('hint-'+key+'-'+index);
  const button=document.getElementById('button-'+key+'-'+index);
  if(!slot)return;

  if(expandedMatch[key]===id){
    expandedMatch[key]=null;
    slot.innerHTML='';
    slot.hidden=true;
    if(hint)hint.textContent='▼ Tippen für Spieldetails und Torschützen';
    if(button)button.setAttribute('aria-expanded','false');
  }else{
    expandedMatch[key]=id;
    slot.innerHTML=detailsHTML(match,key);
    slot.hidden=false;
    if(hint)hint.textContent='▲ Details ausblenden';
    if(button)button.setAttribute('aria-expanded','true');
  }
}

function gamesHTML(key){
  const games=selectedGames(key);
  if(!games.length)
    return '<p class="muted">Keine Spiele für diesen Spieltag gefunden.</p>';

  return games.map((match,index)=>{
    const names=teamNames(match);
    const hasWerder=key==='bl1'&&(isWerder(names.home)||isWerder(names.away));
    const hasVfL=key==='bl2'&&(isVfL(names.home)||isVfL(names.away));
    const cssClass=hasWerder?'werder-match':hasVfL?'vfl-match':'';

    const homeClass=((key==='bl1'&&isWerder(names.home))||
      (key==='bl2'&&isVfL(names.home)))?'team-highlight':'';
    const awayClass=((key==='bl1'&&isWerder(names.away))||
      (key==='bl2'&&isVfL(names.away)))?'team-highlight':'';

    const expanded=expandedMatch[key]===matchKey(match);

    return `<div class="match ${cssClass}" id="card-${key}-${index}">
      <button type="button" class="match-button"
        id="button-${key}-${index}"
        onclick="toggleDetails('${key}',${index})"
        aria-expanded="${expanded}">
        <div class="match-date" id="date-${key}-${index}">${statusHTML(match,key)}</div>
        <div>
          <span class="${homeClass}"><b>${esc(names.home)}</b></span>
          <span class="score" id="score-${key}-${index}">${esc(gameScore(match,key))}</span>
          <span class="${awayClass}"><b>${esc(names.away)}</b></span>
        </div>
        <div class="tap-hint" id="hint-${key}-${index}">${expanded?'▲ Details ausblenden':'▼ Tippen für Spieldetails und Torschützen'}</div>
      </button>

      <div class="details-slot" id="details-${key}-${index}" ${expanded?'':'hidden'}>${expanded?detailsHTML(match,key):''}</div>

      <button type="button" class="lineup-button"
        onclick="aufstellungAbrufen('${key}',${index})">
        👥 Aufstellung, Spielerbilder & Statistiken öffnen
      </button>
    </div>`;
  }).join('');
}

function getTableRows(data){
  if(Array.isArray(data))return data;
  if(Array.isArray(data?.table))return data.table;
  if(Array.isArray(data?.standings)){
    const total=data.standings.find(s=>s.type==='TOTAL');
    return total?.table||data.standings[0]?.table||[];
  }
  return [];
}

function teamName(row){
  return row.team?.shortName||row.team?.name||row.teamName||row.name||'';
}

function tableHTML(data,key){
  const rows=getTableRows(data);
  if(!rows.length)return '<p class="muted">Tabelle nicht verfügbar.</p>';

  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>Pos.</th><th>Verein</th><th>Sp.</th><th>S</th>
      <th>U</th><th>N</th><th>Tore</th><th>TD</th><th>Pkt.</th>
    </tr></thead>
    <tbody>
    ${rows.map((row,index)=>{
      const name=teamName(row);
      const highlighted=key==='bl1'?isWerder(name):isVfL(name);
      const played=row.playedGames??row.matchesPlayed??row.played??'–';
      const wins=row.won??row.wins??row.wonGames??'–';
      const draws=row.draw??row.draws??row.drawGames??'–';
      const losses=row.lost??row.losses??row.lostGames??'–';
      const gf=row.goalsFor??row.goalsScored;
      const ga=row.goalsAgainst??row.goalsConceded;
      const goals=gf!==undefined&&ga!==undefined?gf+':'+ga:(row.goals??'–');
      const difference=row.goalDifference??row.goalDiff??'–';
      const points=row.points??row.pts??'–';
      const position=row.position??row.rank??index+1;

      return `<tr class="${highlighted?(key==='bl1'?'werder-row':'vfl-row'):''}">
        <td>${esc(position)}</td><td>${esc(name)}</td><td>${esc(played)}</td>
        <td>${esc(wins)}</td><td>${esc(draws)}</td><td>${esc(losses)}</td>
        <td>${esc(goals)}</td><td>${esc(difference)}</td><td><b>${esc(points)}</b></td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

function renderGames(key){
  document.getElementById(key+'-selector').innerHTML=roundSelector(key);
  document.getElementById(key+'-games').innerHTML=gamesHTML(key);
}

function renderInitial(){
  renderGames('bl1');
  renderGames('bl2');
  document.getElementById('bl1-table').innerHTML=tableHTML(standings.bl1,'bl1');
  document.getElementById('bl2-table').innerHTML=tableHTML(standings.bl2,'bl2');
  initialRenderDone=true;
}

function updateLiveDisplay(key){
  const games=selectedGames(key);
  games.forEach((match,index)=>{
    const date=document.getElementById(`date-${key}-${index}`);
    const score=document.getElementById(`score-${key}-${index}`);
    const slot=document.getElementById(`details-${key}-${index}`);

    if(date)date.innerHTML=statusHTML(match,key);
    if(score)score.textContent=gameScore(match,key);

    if(slot&&!slot.hidden&&expandedMatch[key]===matchKey(match))
      slot.innerHTML=detailsHTML(match,key);
  });
}

async function loadSavedSources(){
  const jobs=[
    ['bl1-matches',()=>loadFile('bundesliga-spiele.json')],
    ['bl2-matches',()=>loadFile('2bundesliga-spiele.json')],
    ['bl1-openliga',()=>loadFile('openligadb-bl1-spiele.json')],
    ['bl1-scorers',()=>loadFile('openligadb-bl1-torschuetzen.json')],
    ['bl2-scorers',()=>loadFile('openligadb-bl2-torschuetzen.json')]
  ];

  const results=await Promise.allSettled(jobs.map(j=>j[1]()));

  results.forEach((result,index)=>{
    if(result.status!=='fulfilled'){
      console.warn('Zusatzdatei nicht verfügbar:',jobs[index][0],result.reason);
      return;
    }

    const data=result.value;
    switch(jobs[index][0]){
      case 'bl1-matches':
        footballMatches.bl1=Array.isArray(data.matches)?data.matches:[];
        break;
      case 'bl2-matches':
        // Der Workflow lädt derzeit keine football-data.org-Daten für BL2.
        footballMatches.bl2=Array.isArray(data.matches)?data.matches:[];
        break;
      case 'bl1-openliga':
        if(Array.isArray(data))matches.bl1=data;
        break;
      case 'bl1-scorers':
        scorers.bl1=Array.isArray(data)?data:[];
        break;
      case 'bl2-scorers':
        scorers.bl2=Array.isArray(data)?data:[];
        break;
    }
  });
}

async function refreshData(showError=false){
  if(loading)return;
  loading=true;

  try{
    const results=await Promise.allSettled([
      loadLiveGames('bl1'),
      loadLiveGames('bl2')
    ]);

    if(results[0].status==='fulfilled')matches.bl1=results[0].value;
    else console.warn('BL1 Live-Abruf fehlgeschlagen:',results[0].reason);

    if(results[1].status==='fulfilled')matches.bl2=results[1].value;
    else console.warn('BL2 Live-Abruf fehlgeschlagen:',results[1].reason);

    await loadSavedSources();

    try{
      const tableResults=await Promise.allSettled([
        loadFile('bundesliga.json'),
        loadFile('2bundesliga-tabelle.json')
      ]);
      if(tableResults[0].status==='fulfilled')standings.bl1=tableResults[0].value;
      if(tableResults[1].status==='fulfilled')standings.bl2=tableResults[1].value;
    }catch(error){
      console.warn('Tabellen konnten nicht geladen werden:',error);
    }

    if(selectedRound.bl1===null)
      selectedRound.bl1=findDefaultRound(getGames('bl1'));
    if(selectedRound.bl2===null)
      selectedRound.bl2=findDefaultRound(getGames('bl2'));

    lastUpdate=new Date();

    if(!initialRenderDone){
      renderInitial();
    }else{
      updateLiveDisplay('bl1');
      updateLiveDisplay('bl2');
    }

    const stamp='Zuletzt geprüft: '+lastUpdate.toLocaleTimeString('de-DE');
    document.getElementById('bl1-update').textContent=stamp;
    document.getElementById('bl2-update').textContent=stamp;

  }catch(error){
    console.error('Aktualisierung fehlgeschlagen:',error);
    if(showError)
      alert('Live-Daten konnten nicht geladen werden. Bitte später erneut versuchen.');
  }finally{
    loading=false;
  }
}

refreshData();
setInterval(()=>refreshData(),15000);

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)refreshData();
});
</script>
</body>
</html>
