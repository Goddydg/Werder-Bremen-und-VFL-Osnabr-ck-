<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b13">
<title>Werder Bremen & VfL Osnabrück</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #071b13;
  color: #f5f7f5;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px 16px;
  background: #103b28;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin-bottom: 0;
  color: #c5d5cb;
}

main {
  padding: 12px;
}

.league {
  margin-bottom: 30px;
  padding: 14px;
  border-radius: 16px;
  background: #10291e;
  border: 1px solid #244a37;
  scroll-margin-top: 10px;
}

.league-green {
  border-top: 5px solid #35a66b;
}

.league-purple {
  background: #20142d;
  border-color: #593477;
  border-top: 5px solid #a855f7;
}

h2 {
  font-size: 22px;
  margin: 4px 0 14px;
}

h3 {
  font-size: 18px;
  margin: 20px 0 10px;
}

.club {
  display: inline-block;
  padding: 7px 11px;
  margin-bottom: 12px;
  border-radius: 8px;
  background: #1d7045;
  color: white;
  font-weight: bold;
}

.league-purple .club {
  background: #6b21a8;
}

.selector {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 12px 0;
}

select {
  max-width: 100%;
  padding: 11px;
  border-radius: 9px;
  background: #173c2a;
  color: white;
  border: 1px solid #477258;
  font-size: 15px;
}

.league-purple select {
  background: #35194b;
  border-color: #8b5bb4;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  padding: 9px 5px;
  border-bottom: 1px solid #294536;
  text-align: center;
}

th:nth-child(2),
td:nth-child(2) {
  text-align: left;
}

.league-purple th,
.league-purple td {
  border-bottom-color: #493257;
}

tr.werder-row {
  background: #1d7045 !important;
  color: white;
  font-weight: bold;
}

tr.vfl-row {
  background: #6b21a8 !important;
  color: white;
  font-weight: bold;
}

.match {
  padding: 12px 0;
  border-bottom: 1px solid #294536;
}

.league-purple .match {
  border-bottom-color: #493257;
}

.match:last-child {
  border-bottom: 0;
}

.match-date {
  color: #a9beb0;
  font-size: 12px;
  margin-bottom: 6px;
}

.league-purple .match-date {
  color: #c8b3d9;
}

.score {
  display: inline-block;
  padding: 0 5px;
  font-weight: bold;
  white-space: nowrap;
}

.muted {
  color: #a9beb0;
  font-size: 13px;
}

.league-purple .muted {
  color: #c8b3d9;
}

.error {
  color: #ffb5a9;
}

.refresh {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 12px;
  border: 1px solid #37684f;
  border-radius: 10px;
  background: #194a34;
  color: white;
  font-size: 14px;
}

.league-purple .refresh {
  background: #4c1d72;
  border-color: #8b5bb4;
}
</style>
</head>

<body>
<header>
  <h1>⚽ Werder & VfL</h1>
  <p>Bundesliga · Spieltage · Tabellen</p>
</header>

<main>
  <section class="league league-green" id="bundesliga">
    <h2>🟢 1. Bundesliga</h2>
    <div class="club">🟢 SV Werder Bremen</div>

    <h3>Spiele des Spieltags</h3>
    <div id="bl1-selector"></div>
    <div id="bl1-games">Daten werden geladen …</div>

    <h3>Tabelle</h3>
    <div id="bl1-table">Tabelle wird geladen …</div>
    <button class="refresh" onclick="start()">Daten aktualisieren</button>
  </section>

  <section class="league league-purple" id="zweite-bundesliga">
    <h2>🟣 2. Bundesliga</h2>
    <div class="club">🟣 VfL Osnabrück</div>

    <h3>Spiele des Spieltags</h3>
    <div id="bl2-selector"></div>
    <div id="bl2-games">Daten werden geladen …</div>

    <h3>Tabelle</h3>
    <div id="bl2-table">Tabelle wird geladen …</div>
    <button class="refresh" onclick="start()">Daten aktualisieren</button>
  </section>
</main>

<script>
const base = './data/';

let standings = {};
let matches = {};
let selectedRound = {
  bl1: null,
  bl2: null
};

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

async function load(file) {
  const response = await fetch(base + file + '?t=' + Date.now());

  if (!response.ok) {
    throw new Error(file + ' konnte nicht geladen werden.');
  }

  return response.json();
}

function getGames(key) {
  const data = matches[key];
  return Array.isArray(data) ? data : (data?.matches || []);
}

function roundNumber(match, key) {
  if (key === 'bl1') {
    return Number(
      match.matchday ??
      match.season?.currentMatchday ??
      0
    );
  }

  return Number(
    match.group?.groupOrderID ??
    match.groupOrderID ??
    match.matchday ??
    0
  );
}

function gameDate(match, key) {
  return key === 'bl1'
    ? match.utcDate
    : match.matchDateTime;
}

function isFinished(match, key) {
  return key === 'bl1'
    ? match.status === 'FINISHED'
    : Boolean(match.matchIsFinished);
}

function findDefaultRound(games, key) {
  const rounds = [...new Set(
    games.map(g => roundNumber(g, key)).filter(n => n > 0)
  )].sort((a, b) => a - b);

  if (!rounds.length) return null;

  const now = Date.now();
  const today = new Date().toDateString();

  const todayRounds = games
    .filter(g =>
      gameDate(g, key) &&
      new Date(gameDate(g, key)).toDateString() === today
    )
    .map(g => roundNumber(g, key))
    .filter(n => n > 0);

  if (todayRounds.length) return todayRounds[0];

  const upcoming = games
    .filter(g =>
      !isFinished(g, key) &&
      gameDate(g, key) &&
      new Date(gameDate(g, key)).getTime() >= now
    )
    .sort((a, b) =>
      new Date(gameDate(a, key)) - new Date(gameDate(b, key))
    );

  if (upcoming.length) {
    return roundNumber(upcoming[0], key);
  }

  const unfinished = games
    .filter(g => !isFinished(g, key) && roundNumber(g, key) > 0)
    .sort((a, b) =>
      new Date(gameDate(a, key) || 0) -
      new Date(gameDate(b, key) || 0)
    );

  if (unfinished.length) {
    return roundNumber(unfinished[0], key);
  }

  return Math.max(...rounds);
}

function ensureRound(key) {
  if (selectedRound[key] === null) {
    selectedRound[key] = findDefaultRound(getGames(key), key);
  }
}

function changeRound(key, value) {
  selectedRound[key] = Number(value);
  renderGames(key);
}

function roundSelector(key) {
  const games = getGames(key);

  const rounds = [...new Set(
    games.map(g => roundNumber(g, key)).filter(n => n > 0)
  )].sort((a, b) => a - b);

  ensureRound(key);

  if (!rounds.length) {
    return '<p class="muted">Keine Spieltage verfügbar.</p>';
  }

  return `
    <div class="selector">
      <label for="${key}-round"><b>Spieltag:</b></label>
      <select id="${key}-round"
        onchange="changeRound('${key}', this.value)">
        ${rounds.map(n => `
          <option value="${n}"
            ${n === selectedRound[key] ? 'selected' : ''}>
            ${n}. Spieltag
          </option>
        `).join('')}
      </select>
    </div>
  `;
}

function selectedGames(key) {
  ensureRound(key);

  return getGames(key)
    .filter(g => roundNumber(g, key) === selectedRound[key])
    .sort((a, b) =>
      new Date(gameDate(a, key) || 0) -
      new Date(gameDate(b, key) || 0)
    );
}

function teamNames(match, key) {
  if (key === 'bl1') {
    return {
      home: match.homeTeam?.shortName ||
            match.homeTeam?.name || 'Unbekannt',
      away: match.awayTeam?.shortName ||
            match.awayTeam?.name || 'Unbekannt'
    };
  }

  return {
    home: match.team1?.teamName || 'Unbekannt',
    away: match.team2?.teamName || 'Unbekannt'
  };
}

function gameScore(match, key) {
  if (key === 'bl1') {
    const home = match.score?.fullTime?.home;
    const away = match.score?.fullTime?.away;

    return home == null || away == null
      ? '– : –'
      : home + ' : ' + away;
  }

  const results = match.matchResults || [];
  const result =
    results.find(r => r.resultTypeID === 2) ||
    results.reduce((best, r) =>
      !best || Number(r.resultTypeID) > Number(best.resultTypeID)
        ? r
        : best
    , null);

  if (!result) return '– : –';

  return `${result.pointsTeam1} : ${result.pointsTeam2}`;
}

function formatDate(value) {
  if (!value) return 'Termin offen';

  return new Date(value).toLocaleString('de-DE', {
    weekday: 'short',
    day: '2-digit',
    month: '2-digit',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function statusText(match, key) {
  if (isFinished(match, key)) return 'Beendet';

  if (
    gameDate(match, key) &&
    new Date(gameDate(match, key)) < new Date()
  ) {
    return 'Ergebnis noch nicht verfügbar';
  }

  return 'Anstoß: ' + formatDate(gameDate(match, key));
}

function gamesHTML(key) {
  const games = selectedGames(key);

  if (!games.length) {
    return '<p class="muted">Keine Spiele für diesen Spieltag gefunden.</p>';
  }

  return games.map(match => {
    const names = teamNames(match, key);

    return `
      <div class="match">
        <div class="match-date">${esc(statusText(match, key))}</div>
        <div>
          <b>${esc(names.home)}</b>
          <span class="score">${esc(gameScore(match, key))}</span>
          <b>${esc(names.away)}</b>
        </div>
      </div>
    `;
  }).join('');
}

function getTableRows(data) {
  if (Array.isArray(data)) return data;

  if (Array.isArray(data?.table)) return data.table;

  if (Array.isArray(data?.standings)) {
    const total = data.standings.find(s => s.type === 'TOTAL');
    return total?.table || data.standings[0]?.table || [];
  }

  return [];
}

function teamName(row) {
  return row.team?.shortName ||
         row.team?.name ||
         row.teamName ||
         row.name ||
         '';
}

function isWerder(name) {
  const n = name.toLowerCase();
  return n.includes('werder') || n.includes('bremen');
}

function isVfL(name) {
  const n = name.toLowerCase();
  return n.includes('osnabrück') ||
         n.includes('osnabrueck') ||
         n.includes('vfl osnabr');
}

function tableHTML(data, key) {
  const rows = getTableRows(data);

  if (!rows.length) {
    return '<p class="muted">Tabelle nicht verfügbar.</p>';
  }

  return `
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Verein</th>
          <th>Sp</th>
          <th>TD</th>
          <th>Pkt</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((row, index) => {
          const name = teamName(row);

          const highlighted = key === 'bl1'
            ? isWerder(name)
            : isVfL(name);

          const played = row.playedGames ??
                         row.matchesPlayed ??
                         row.played ?? '–';

          const difference = row.goalDifference ??
                             row.goalDiff ?? '–';

          const points = row.points ?? row.pts ?? '–';
          const position = row.position ?? row.rank ?? index + 1;

          return `
            <tr class="${highlighted
              ? (key === 'bl1' ? 'werder-row' : 'vfl-row')
              : ''}">
              <td>${esc(position)}</td>
              <td>${esc(name)}</td>
              <td>${esc(played)}</td>
              <td>${esc(difference)}</td>
              <td><b>${esc(points)}</b></td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

function renderGames(key) {
  document.getElementById(key + '-selector').innerHTML =
    roundSelector(key);

  document.getElementById(key + '-games').innerHTML =
    gamesHTML(key);
}

function render() {
  renderGames('bl1');
  renderGames('bl2');

  document.getElementById('bl1-table').innerHTML =
    tableHTML(standings.bl1, 'bl1');

  document.getElementById('bl2-table').innerHTML =
    tableHTML(standings.bl2, 'bl2');
}

async function start() {
  document.getElementById('bl1-games').textContent =
    'Daten werden geladen …';

  document.getElementById('bl2-games').textContent =
    'Daten werden geladen …';

  try {
    const [bl1, bl1Games, bl2Table, bl2Games] =
      await Promise.all([
        load('bundesliga.json'),
        load('bundesliga-spiele.json'),
        load('2bundesliga-tabelle.json'),
        load('2bundesliga-spiele.json')
      ]);

    standings.bl1 = bl1;
    matches.bl1 = bl1Games;
    standings.bl2 = bl2Table;
    matches.bl2 = bl2Games;

    selectedRound.bl1 = findDefaultRound(getGames('bl1'), 'bl1');
    selectedRound.bl2 = findDefaultRound(getGames('bl2'), 'bl2');

    render();
  } catch (error) {
    document.getElementById('bl1-games').innerHTML =
      '<p class="error">Fehler beim Laden: ' + esc(error.message) + '</p>';

    document.getElementById('bl2-games').innerHTML =
      '<p class="error">Fehler beim Laden der Daten.</p>';
  }
}

start();
</script>
</body>
</html>
