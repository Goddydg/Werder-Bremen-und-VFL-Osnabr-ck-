
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b13">
<title>Werder & VfL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b13;color:#f5f7f5;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#103b28}
h1{margin:0;font-size:25px}
p{color:#c5d5cb}
nav{display:flex;gap:8px;padding:12px;overflow:auto}
button{background:#194a34;color:white;border:1px solid #37684f;border-radius:10px;padding:12px;white-space:nowrap;font-size:15px}
button.active{background:#35a66b;color:#071b13;font-weight:bold}
main{padding:12px}
h2{font-size:21px}
.card{background:#10291e;border:1px solid #244a37;border-radius:14px;padding:14px;margin-bottom:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 5px;border-bottom:1px solid #294536;text-align:center}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.focus{background:#1d5136;font-weight:bold}
.match{padding:12px 0;border-bottom:1px solid #294536}
.muted{color:#a9beb0;font-size:13px}
.error{color:#ffb5a9}
</style>
</head>
<body>
<header>
<h1>⚽ Werder & VfL</h1>
<p>Deine Fußball-App · Bundesliga & 2. Bundesliga</p>
</header>
<nav>
<button class="active" onclick="show('bl1',this)">1. Bundesliga</button>
<button onclick="show('werder',this)">Werder Bremen</button>
<button onclick="show('bl2',this)">2. Bundesliga</button>
<button onclick="show('vfl',this)">VfL Osnabrück</button>
</nav>
<main id="app">Daten werden geladen …</main>
<script>
const base='./data/';
let standings={},matches={},current='bl1';
async function load(file){
 const r=await fetch(base+file+'?t='+Date.now());
 if(!r.ok) throw Error(file+' nicht gefunden');
 return r.json();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function date(s){return s?new Date(s).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):''}
function table(data,focus){
 const rows=data?.standings?.find(x=>x.type==='TOTAL')?.table||[];
 if(!rows.length)return '<p>Tabelle nicht verfügbar.</p>';
 return '<table><thead><tr><th>#</th><th>Verein</th><th>Sp</th><th>TD</th><th>Pkt</th></tr></thead><tbody>'+
 rows.map(t=>`<tr class="${t.team.shortName===focus||t.team.name===focus?'focus':''}"><td>${t.position}</td><td>${esc(t.team.shortName||t.team.name)}</td><td>${t.playedGames}</td><td>${t.goalDifference}</td><td><b>${t.points}</b></td></tr>`).join('')+
 '</tbody></table>';
}
function listFootballData(data,team){
 const arr=(data?.matches||[]).filter(m=>!team||m.homeTeam.name.includes(team)||m.awayTeam.name.includes(team));
 if(!arr.length)return '<p>Keine Spiele gefunden.</p>';
 return arr.slice(0,30).map(m=>`<div class="match"><div class="muted">${date(m.utcDate)} · ${esc(m.status)}</div><b>${esc(m.homeTeam.shortName||m.homeTeam.name)}</b> ${m.score?.fullTime?.home??'–'} : ${m.score?.fullTime?.away??'–'} <b>${esc(m.awayTeam.shortName||m.awayTeam.name)}</b></div>`).join('');
}
function listOpenLiga(data,team){
 const arr=(Array.isArray(data)?data:[]).filter(m=>!team||m.team1?.teamName?.includes(team)||m.team2?.teamName?.includes(team));
 if(!arr.length)return '<p>Keine Spiele gefunden.</p>';
 return arr.slice(0,30).map(m=>`<div class="match"><div class="muted">${date(m.matchDateTime)} · ${esc(m.matchIsFinished?'Beendet':'Geplant')}</div><b>${esc(m.team1?.teamName)}</b> ${m.matchResults?.find(r=>r.resultTypeID===2)?.pointsTeam1??'–'} : ${m.matchResults?.find(r=>r.resultTypeID===2)?.pointsTeam2??'–'} <b>${esc(m.team2?.teamName)}</b></div>`).join('');
}
function show(page,btn){
 current=page;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b===btn));
 render();
}
function render(){
 const app=document.getElementById('app');
 if(current==='bl1')app.innerHTML='<div class="card"><h2>1. Bundesliga · Tabelle</h2>'+table(standings.bl1,'SV Werder Bremen')+'</div><div class="card"><h2>Spiele</h2>'+listFootballData(matches.bl1)+'</div>';
 if(current==='werder')app.innerHTML='<div class="card"><h2>SV Werder Bremen</h2>'+table(standings.bl1,'SV Werder Bremen')+'</div><div class="card"><h2>Werder-Spiele</h2>'+listFootballData(matches.bl1,'Werder Bremen')+'</div>';
 if(current==='bl2')app.innerHTML='<div class="card"><h2>2. Bundesliga</h2><p>OpenLigaDB · Spielplan und Ergebnisse</p>'+listOpenLiga(matches.bl2)+'</div>';
 if(current==='vfl')app.innerHTML='<div class="card"><h2>VfL Osnabrück</h2><p>OpenLigaDB · Spielplan und Ergebnisse</p>'+listOpenLiga(matches.bl2,'Osnabrück')+'</div>';
}
async function start(){
 try{
  [standings.bl1,matches.bl1,matches.bl2]=await Promise.all([
   load('bundesliga.json'),load('bundesliga-spiele.json'),load('2bundesliga-spiele.json')
  ]);
  render();
 }catch(e){
  document.getElementById('app').innerHTML='<div class="card"><p class="error">Daten konnten nicht geladen werden.</p><p class="muted">'+esc(e.message)+'</p><button onclick="start()">Erneut laden</button></div>';
 }
}
start();
</script>
</body>
</html>
