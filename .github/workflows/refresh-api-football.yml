name: Refresh Bundesliga website card events

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-api-football.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read card events from official Bundesliga match pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/bundesliga-card-events.json';
          const season = 2026;
          const leagues = {
            bl1: { openLiga: 'bl1', website: 'bundesliga' },
            bl2: { openLiga: 'bl2', website: '2bundesliga' }
          };
          const now = Date.now();
          const from = now - 5 * 86400000;
          const to = now + 2 * 86400000;
          const saved = fs.existsSync(path)
            ? JSON.parse(fs.readFileSync(path, 'utf8'))
            : { updatedAt: null, leagues: { bl1: {}, bl2: {} } };
          saved.leagues ||= {};
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          const { execFileSync } = require('child_process');

          async function get(url) {
            const response = await fetch(url, {
              headers: { 'User-Agent': 'Mozilla/5.0 (compatible; MatchEventsBot/1.0)', 'Accept-Language': 'de-DE,de;q=0.9,en;q=0.8' }
            });
            if (!response.ok) throw new Error('HTTP ' + response.status + ' for ' + url);
            return response;
          }
          function slug(value) {
            return String(value || '').toLowerCase()
              .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
              .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
              .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
          }
          function decode(value) {
            return value.replace(/&nbsp;|&#160;/g,' ')
              .replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'")
              .replace(/&uuml;/g,'ü').replace(/&Uuml;/g,'Ü').replace(/&auml;/g,'ä')
              .replace(/&ouml;/g,'ö').replace(/&Auml;/g,'Ä').replace(/&Ouml;/g,'Ö')
              .replace(/&szlig;/g,'ß').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          }
          function extractCards(html) {
            const text = decode(html
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ')
              .replace(/<[^>]+>/g,' ')
              .replace(/\s+/g,' '));
            const cards = [];
            const re = /(?:Gelbe Karte|Gelb-Rote Karte|Rote Karte|Yellow card|Red card)/gi;
            let m;
            while ((m = re.exec(text))) {
              const before = text.slice(Math.max(0,m.index-140),m.index);
              const after = text.slice(m.index,Math.min(text.length,m.index+240));
              const minuteMatches = [...before.matchAll(/\b(\d{1,3})\s*['′]?\s*(?:\+\s*(\d{1,2}))?\s*$/g)];
              const minute = minuteMatches.length
                ? minuteMatches[minuteMatches.length-1][1] + (minuteMatches[minuteMatches.length-1][2] ? '+' + minuteMatches[minuteMatches.length-1][2] : '') + '′'
                : '';
              const afterText = after.replace(m[0],'').replace(/^\s*(?:Image:\s*(?:yellowCard|redCard|yellowRedCard))?\s*/i,'');
              const playerMatch = afterText.match(/^([A-ZÀ-Þ][\p{L}.'’ -]{1,50}?)(?=\s+(?:\d{1,3}\s*['′]|Gelbe Karte|Rote Karte|Gelb-Rote Karte|TOR|Wechsel|$))/u)
                || afterText.match(/^([A-ZÀ-Þ][\p{L}.'’ -]{2,45})/u);
              const type = /gelb-rot|yellow-red/i.test(m[0]) ? 'yellow-red' : /rote|red card/i.test(m[0]) ? 'red' : 'yellow';
              const player = playerMatch ? playerMatch[1].trim() : '';
              if (!player) continue;
              const signature = [minute,type,player].join('|').toLowerCase();
              if (!cards.some(c => c.signature === signature)) cards.push({ minute, type, player, signature });
            }
            return cards.map(({signature,...card})=>card);
          }

          // --- Club crests, substitutions and ticker lookup --------------------------
          // The ticker shows the club crest (an image named after the DFL club id, e.g.
          // DFL-CLU-00000E) next to every card and substitution. The id is stored as
          // crestId and resolved to a team name through saved.clubs (crest id ->
          // OpenLigaDB team name). Everything here is best effort: a problem only means
          // that an entry has no crest, never that an entry is lost.
          const clubs = (saved.clubs ||= {});
          const normWords = value => ' ' + String(value || '').normalize('NFD').replace(/[̀-ͯ]/g,'')
            .toLowerCase().replace(/[^a-z]+/g,' ').trim() + ' ';
          const textOf = fragment => decode(String(fragment || '')
            .replace(/<script\b[\s\S]*?<\/script>/gi,' ').replace(/<style\b[\s\S]*?<\/style>/gi,' ')
            .replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').trim();
          // Text of the first player link (…/spieler/<name>) that is not a statistics link.
          const anchorName = fragment => {
            for (const m of String(fragment || '').matchAll(/<a\b[^>]*href="[^"]*\/spieler\/[^"]*"[^>]*>([\s\S]*?)<\/a>/gi)) {
              if (/\/statistiken\//i.test(m[0].slice(0, m[0].indexOf('>') + 1))) continue;
              const text = textOf(m[1]);
              if (text) return text;
            }
            return '';
          };
          function minuteBefore(html, index) {
            const cut = html.lastIndexOf('<', index);
            const end = cut >= 0 ? cut : index;
            const text = textOf(html.slice(Math.max(0, end - 1500), end));
            const m = text.match(/(\d{1,3})\s*['′’]?\s*(?:\+\s*(\d{1,2})\s*['′’]?)?\s*(?:Wechsel|Auswechslung|Einwechslung)?\s*$/i);
            return m ? `${parseInt(m[1], 10)}${m[2] ? '+' + parseInt(m[2], 10) : ''}′` : '';
          }
          function attachCrestIds(html, cards) {
            const markers = [...html.matchAll(/(?:yellowRedCard|yellowCard|redCard)[^"'\s>]*\.svg/gi)].map(m => m.index);
            const entries = markers.map((start, i) => {
              const end = Math.min(markers[i + 1] ?? html.length, start + 3000);
              const windowHtml = html.slice(start, end);
              const crest = (windowHtml.match(/DFL-CLU-([0-9A-Z]{4,8})/) || [])[1] || '';
              return { crest, name: anchorName(windowHtml), words: normWords(decode(windowHtml)) };
            }).filter(entry => entry.crest);
            for (const card of cards) {
              const tokens = normWords(card.player).trim().split(' ').filter(t => t.length > 1);
              for (const size of [2, 1]) {
                const name = tokens.slice(0, size).join(' ');
                if (!name) continue;
                const found = entries.find(entry => entry.words.includes(' ' + name + ' '));
                if (found) {
                  card.crestId = found.crest;
                  // the plain-text player name is often followed by ticker text; prefer the link text
                  if (found.name && normWords(card.player).startsWith(normWords(found.name))) card.player = found.name;
                  break;
                }
              }
            }
          }
          // Substitutions: every one is "substitution_in" icon + player, "substitution_out" icon + player, club crest.
          function extractSubs(html) {
            const marks = [...html.matchAll(/substitution_in/gi)].map(m => m.index);
            const subs = [], seen = new Set();
            marks.forEach((mark, i) => {
              const start = html.lastIndexOf('<', mark);
              if (start < 0) return;
              const nextStart = i + 1 < marks.length ? html.lastIndexOf('<', marks[i + 1]) : html.length;
              const end = Math.min(nextStart, start + 4000);
              const outMark = html.slice(start, end).search(/substitution_out/i);
              if (outMark < 0) return;
              const outStart = html.lastIndexOf('<', start + outMark);
              const inPart = html.slice(start, outStart), outPart = html.slice(outStart, end);
              const clu = outPart.search(/DFL-CLU-/);
              const inName = anchorName(inPart) || textOf(inPart);
              const outName = anchorName(outPart) || textOf(clu >= 0 ? outPart.slice(0, Math.max(0, outPart.lastIndexOf('<', clu))) : outPart);
              const crest = (outPart.match(/DFL-CLU-([0-9A-Z]{4,8})/) || inPart.match(/DFL-CLU-([0-9A-Z]{4,8})/) || [])[1] || '';
              const valid = name => name.length >= 2 && name.length <= 60 && !/substitution|DFL-|\.svg/i.test(name);
              if (!valid(inName) || !valid(outName)) return;
              const sub = { minute: minuteBefore(html, start), in: inName, out: outName };
              if (crest) sub.crestId = crest;
              const key = [sub.minute, sub.in, sub.out].join('|').toLowerCase();
              if (!seen.has(key)) { seen.add(key); subs.push(sub); }
            });
            return subs;
          }
          function assignTeam(item, home, away) {
            if (!item.crestId || item.team) return;
            const idOf = team => Object.keys(clubs).find(key => clubs[key] === team);
            const known = clubs[item.crestId];
            if (known === home || known === away) { item.team = known; }
            else if (!known) {
              const homeId = idOf(home), awayId = idOf(away);
              if (homeId && !awayId && item.crestId !== homeId) item.team = away;
              else if (awayId && !homeId && item.crestId !== awayId) item.team = home;
              if (item.team) clubs[item.crestId] = item.team;
            }
            if (item.team) item.teamSide = item.team === home ? 'home' : 'away';
          }

          // The ticker address is built from the team names, which do not always match the
          // OpenLigaDB names (e.g. "Dynamo Dresden" is "sg-dynamo-dresden" on the site).
          // Try a few spellings; the address that worked is remembered per match.
          const SLUG_ALIASES = { 'dynamo-dresden': 'sg-dynamo-dresden' };
          function slugVariants(name) {
            const base = slug(name);
            const stripped = base.replace(/^(?:1-)?(?:dsc|sv|fc|vfl|vfb|tsg|tsv|sc|spvgg|ssv|sg|fsv)-/, '');
            return [...new Set([SLUG_ALIASES[base], base, stripped, 'sg-' + stripped, 'fc-' + stripped, 'sv-' + stripped].filter(Boolean))];
          }
          function tickerUrls(config, round, home, away, knownUrl) {
            const hs = slugVariants(home), as = slugVariants(away), pairs = [];
            hs.forEach((h, i) => as.forEach((a, j) => pairs.push([i + j, h, a])));
            pairs.sort((x, y) => x[0] - y[0]);
            const urls = pairs.map(([, h, a]) => `https://www.bundesliga.com/de/${config.website}/spieltag/${season}-${season + 1}/${round}/${h}-vs-${a}/liveticker/`);
            return [...new Set([knownUrl, ...urls].filter(Boolean))].slice(0, 9);
          }
          async function fetchTicker(config, round, home, away, knownUrl) {
            let lastError = new Error('no ticker address');
            for (const url of tickerUrls(config, round, home, away, knownUrl)) {
              try { await wait(900); const page = await get(url); return { url, html: await page.text() }; }
              catch (error) { lastError = error; if (!/HTTP 404/.test(String(error))) break; }
            }
            throw lastError;
          }
          const contentKey = value => JSON.stringify(value, (k, v) => (k === 'updatedAt' || k === 'checkedAt') ? undefined : v);

          (async () => {
            let checked = 0, found = 0;
            let lastContent = contentKey(saved);
            // GitHub Actions scheduled workflows have a 5-minute minimum interval.
            // Poll live match pages once per minute during this run.
            for (let cycle = 0; cycle < 5; cycle++) {
              checked = 0; found = 0;
              const cycleNow = Date.now();
              const liveFrom = cycleNow - 3 * 60 * 60 * 1000;
              let finalBudget = 6; // finished matches that are read (once each) per poll
              for (const [leagueKey, config] of Object.entries(leagues)) {
              const fixtureUrl = `https://api.openligadb.de/getmatchdata/${config.openLiga}/${season}`;
              const response = await get(fixtureUrl);
              const fixtures = await response.json();
              const output = { ...(saved.leagues[leagueKey] || {}) };
              for (const fixture of fixtures) {
                // matchDateTime is local (German) time without a zone; the UTC field is the reliable one.
                const date = new Date(fixture.matchDateTimeUTC || fixture.matchDateTime || '').getTime();
                if (!Number.isFinite(date)) continue;
                const round = Number(fixture.group?.groupOrderID || fixture.groupOrderID || fixture.matchday || 0);
                const home = fixture.team1?.teamName || '';
                const away = fixture.team2?.teamName || '';
                const id = String(fixture.matchID || '');
                if (!id || !home || !away || !round) continue;
                const previous = output[id] || {};
                const finished = fixture.matchIsFinished === true;
                let mode = '';
                if (!finished && date >= liveFrom && date <= cycleNow) mode = 'live';
                else if (finished && date <= cycleNow && !previous.finalChecked && (previous.finalAttempts || 0) < 3 && finalBudget > 0
                  && (date > cycleNow - 24 * 3600 * 1000 || /werder|osnabr/i.test(home + ' ' + away))) { mode = 'final'; finalBudget--; }
                if (!mode) continue;
                try {
                  const { url, html } = await fetchTicker(config, round, home, away, previous.url);
                  const cards = extractCards(html);
                  try { attachCrestIds(html, cards); } catch (error) { console.warn('Crest ids not read:', String(error)); }
                  let subs = [];
                  try { subs = extractSubs(html); } catch (error) { console.warn('Substitutions not read:', String(error)); }
                  if (cards.length) found += cards.length;
                  const merged = [...(previous.cards || [])];
                  const keyOf = c => [c.minute || '', c.type || '', c.player || ''].join('|').toLowerCase();
                  const seen = new Set(merged.map(keyOf));
                  for (const card of cards) {
                    const key = keyOf(card);
                    if (!seen.has(key)) { merged.push(card); seen.add(key); }
                    else if (card.crestId) {
                      const old = merged.find(c => keyOf(c) === key);
                      if (old && !old.crestId) old.crestId = card.crestId;
                    }
                  }
                  // a fresh, complete read replaces the stored substitutions; a poorer read keeps them
                  const previousSubs = previous.subs || [];
                  const mergedSubs = subs.length && subs.length >= previousSubs.length ? subs : previousSubs;
                  try {
                    for (const item of [...merged, ...mergedSubs]) assignTeam(item, home, away);
                    console.log(`${leagueKey} ${home} - ${away} (${mode}): ${merged.filter(c => c.team).length}/${merged.length} cards and ${mergedSubs.filter(s => s.team).length}/${mergedSubs.length} substitutions with club`);
                  } catch (error) { console.warn('Teams not resolved:', String(error)); }
                  output[id] = { ...previous, matchId: id, home, away, round, url, cards: merged, subs: mergedSubs, checkedAt: new Date().toISOString() };
                  if (mode === 'final') output[id].finalChecked = true;
                  checked++;
                } catch (error) {
                  console.warn('Could not read official match page:', home, '-', away, String(error));
                  if (mode === 'final') output[id] = { ...previous, matchId: id, home, away, round, cards: previous.cards || [], finalAttempts: (previous.finalAttempts || 0) + 1 };
                }
              }
              saved.leagues[leagueKey] = output;
              }
              // Only write and commit when something other than the check timestamps changed.
              const content = contentKey(saved);
              if (content !== lastContent) {
                lastContent = content;
                saved.updatedAt = new Date().toISOString();
                saved.source = 'bundesliga.com';
                fs.mkdirSync('data', { recursive: true });
                fs.writeFileSync(path, JSON.stringify(saved, null, 2) + '\n');
                execFileSync('git', ['add', path]);
                try {
                  execFileSync('git', ['diff', '--cached', '--quiet']);
                } catch {
                  execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
                  execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
                  execFileSync('git', ['commit', '-m', `Refresh Bundesliga card events (${new Date().toISOString()})`]);
                  execFileSync('git', ['push']);
                }
              } else {
                console.log(`Minute poll ${cycle + 1}: no card data changes.`);
              }
              console.log(`Minute poll ${cycle + 1}: read ${checked} match pages; extracted ${found} card events.`);
              if (cycle < 4) await wait(60000);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit refreshed card events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bundesliga-card-events.json
          if git diff --cached --quiet; then
            echo "No card event changes."
          else
            git commit -m "Refresh official Bundesliga card events"
            git push
          fi
