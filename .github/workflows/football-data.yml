
name: Fussballdaten diagnostizieren

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: API-Endpunkte einzeln pruefen
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          for ENDPOINT in \
            "BL1/matches" \
            "BL2/standings" \
            "BL2/matches"
          do
            echo "Pruefe $ENDPOINT"
            STATUS=$(curl -sS \
              -o /tmp/antwort.json \
              -w "%{http_code}" \
              -H "X-Auth-Token: $TOKEN" \
              "https://api.football-data.org/v4/competitions/$ENDPOINT")
            echo "HTTP_STATUS: $STATUS"
            if [ "$STATUS" != "200" ]; then
              cat /tmp/antwort.json
              echo
            fi
          done

