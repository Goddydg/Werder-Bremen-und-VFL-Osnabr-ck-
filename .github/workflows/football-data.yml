name: Fussballdaten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Bundesliga abrufen
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          mkdir -p data

          curl -fsS --retry 3 --retry-delay 5 \
            -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/competitions/BL1/standings" \
            -o data/bundesliga.json

          curl -fsS --retry 3 --retry-delay 5 \
            -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/competitions/BL1/matches" \
            -o data/bundesliga-spiele.json

      - name: Zweite Bundesliga abrufen
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "https://api.openligadb.de/getmatchdata/bl2/2026" \
            -o data/2bundesliga-spiele.json

      - name: Tabelle der zweiten Bundesliga berechnen
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict

          with open("data/2bundesliga-spiele.json", encoding="utf-8") as f:
              matches = json.load(f)

          teams = defaultdict(lambda: {
              "playedGames": 0, "won": 0, "draw": 0,
              "lost": 0, "points": 0,
              "goalsFor": 0, "goalsAgainst": 0
          })
          names = {}

          for match in matches:
              if not match.get("matchIsFinished"):
                  continue

              home = match.get("team1", {})
              away = match.get("team2", {})
              home_id = str(home.get("teamId"))
              away_id = str(away.get("teamId"))

              result = next(
                  (r for r in match.get("matchResults", [])
                   if r.get("resultTypeID") == 2),
                  None
              )

              if result is None:
                  result = max(
                      match.get("matchResults", []),
                      key=lambda r: r.get("resultTypeID", 0),
                      default=None
                  )

              if result is None:
                  continue

              hg = result.get("pointsTeam1")
              ag = result.get("pointsTeam2")
              if hg is None or ag is None:
                  continue

              names[home_id] = home.get("teamName", "Unbekannt")
              names[away_id] = away.get("teamName", "Unbekannt")

              h, a = teams[home_id], teams[away_id]
              h["playedGames"] += 1
              a["playedGames"] += 1
              h["goalsFor"] += hg
              h["goalsAgainst"] += ag
              a["goalsFor"] += ag
              a["goalsAgainst"] += hg

              if hg > ag:
                  h["won"] += 1
                  h["points"] += 3
                  a["lost"] += 1
              elif hg < ag:
                  a["won"] += 1
                  a["points"] += 3
                  h["lost"] += 1
              else:
                  h["draw"] += 1
                  a["draw"] += 1
                  h["points"] += 1
                  a["points"] += 1

          table = []
          for team_id, stats in teams.items():
              name = names[team_id]
              table.append({
                  "position": 0,
                  "team": {
                      "id": int(team_id),
                      "name": name,
                      "shortName": name,
                      "tla": "",
                      "crest": ""
                  },
                  **stats,
                  "goalDifference":
                      stats["goalsFor"] - stats["goalsAgainst"]
              })

          table.sort(key=lambda t: (
              -t["points"],
              -t["goalDifference"],
              -t["goalsFor"],
              t["team"]["name"]
          ))

          for position, team in enumerate(table, 1):
              team["position"] = position

          output = {
              "competition": {
                  "name": "2. Bundesliga",
                  "code": "BL2"
              },
              "standings": [{
                  "stage": "REGULAR_SEASON",
                  "type": "TOTAL",
                  "table": table
              }]
          }

          with open("data/2bundesliga-tabelle.json", "w",
                    encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Tabelle erstellt: {len(table)} Mannschaften")
          PY

      - name: Spielstatistiken kostenlos abrufen
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API_FOOTBALL_KEY fehlt. Zusatzstatistiken werden übersprungen."
            echo '{"matches":{},"updatedAt":null}' > data/spielstatistiken.json
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import datetime
          import unicodedata
          import re
          import time

          API_KEY = os.environ["API_KEY"]
          BASE = "https://v3.football.api-sports.io"
          TODAY = datetime.date.today()
          DATE_FROM = (TODAY - datetime.timedelta(days=2)).isoformat()
          DATE_TO = (TODAY + datetime.timedelta(days=5)).isoformat()

          def normalize(text):
              text = unicodedata.normalize("NFKD", str(text or ""))
              text = "".join(c for c in text if not unicodedata.combining(c))
              text = text.casefold().replace("&", "and")
              return re.sub(r"[^a-z0-9]", "", text)

          def api(path, params):
              query = urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  f"{BASE}/{path}?{query}",
                  headers={"x-apisports-key": API_KEY}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))

              if data.get("errors"):
                  raise RuntimeError(str(data["errors"]))
              return data.get("response", [])

          # Deutsche Bundesliga: API-Football-Ligen 78 und 79.
          fixtures = []
          for league_id in (78, 79):
              result = api("fixtures", {
                  "league": league_id,
                  "season": 2026,
                  "from": DATE_FROM,
                  "to": DATE_TO,
                  "timezone": "Europe/Berlin"
              })
              fixtures.extend(result)
              time.sleep(1)

          # Nur Spiele abrufen, die im Zeitraum liegen.
          ids = list(dict.fromkeys(
              str(item.get("fixture", {}).get("id"))
              for item in fixtures
              if item.get("fixture", {}).get("id")
          ))

          details = []
          for start in range(0, len(ids), 20):
              batch = ids[start:start + 20]
              details.extend(api("fixtures", {"ids": "-".join(batch)}))
              time.sleep(1)

          output = {}
          for item in details:
              fixture = item.get("fixture", {})
              teams = item.get("teams", {})
              home = teams.get("home", {}).get("name", "")
              away = teams.get("away", {}).get("name", "")
              date = fixture.get("date", "")[:10]

              if not home or not away or not date:
                  continue

              key = "|".join((date, normalize(home), normalize(away)))
              output[key] = item

          payload = {
              "updatedAt": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "dateFrom": DATE_FROM,
              "dateTo": DATE_TO,
              "matches": output
          }

          with open("data/spielstatistiken.json", "w",
                    encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))

          print(f"Statistiken gespeichert: {len(output)} Spiele")
          PY

      - name: Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (
            git commit -m "Fussballdaten aktualisieren"
            git push
          )