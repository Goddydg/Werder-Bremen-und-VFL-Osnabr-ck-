
name: Fussballdaten diagnostizieren

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: API-Zugriff pruefen
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set +e
          RESPONSE=$(curl -sS \
            -w '\nHTTP_STATUS:%{http_code}' \
            -H "X-Auth-Token: $TOKEN" \
            "https://api.football-data.org/v4/competitions/BL1/standings")
          echo "$RESPONSE"
